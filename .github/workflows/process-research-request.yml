name: Process Loom Research Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  ingest:
    if: contains(github.event.issue.body, '### What do you want to know?')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install pyyaml jsonschema

      - name: Create inquiry and research plan
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: python scripts/process_research_request.py "$EVENT_PATH"

      - name: Build research queue
        run: python scripts/build_research_queue.py

      - name: Commit research request record
        run: |
          git config user.name "Project Loom Research Bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/inquiries research/plans research/queue.json
          git diff --cached --quiet || git commit -m "Ingest public Loom research request #${{ github.event.issue.number }}"
          git push
