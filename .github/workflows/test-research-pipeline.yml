name: Research Pipeline Tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test dependencies
        run: python -m pip install pyyaml jsonschema
      - name: Run research pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Validate persisted inquiry and plan records
        run: python scripts/validate_research_records.py
