name: Validate Loom Artifacts

on:
  push:
    branches: [ "main" ]
    paths:
      - 'artifacts/**/*.yaml'
      - 'tests/**/*.yaml'
      - 'schemas/**/*.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'artifacts/**/*.yaml'
      - 'tests/**/*.yaml'
      - 'schemas/**/*.yaml'

jobs:
  validate:
    name: Loom Validator CI Gate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Loom Validator
        run: |
          echo "🛡️ Running epistemic and schema validation..."
          python loom_validator/validator.py .
          
      - name: Fail if validation errors exist
        if: failure()
        run: |
          echo "::error::🚨 VALIDATION FAILED! Epistemic rules were violated."
          echo "A change that fails validation cannot be promoted, even by human governance action."
          echo "See the logs above for the specific rule code and remediation steps."
          exit 1
