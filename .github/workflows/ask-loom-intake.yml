name: Ask Loom Research Intake

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ask-loom-intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'research-request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Create persistent inquiry and research plan
        id: ingest
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          python scripts/ingest_research_request.py \
            --number "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --url "$ISSUE_URL"

      - name: Rebuild persistent research queue
        run: python scripts/build_research_queue.py

      - name: Commit inquiry, plan, and queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/inquiries research/plans research/queue.json
          if git diff --cached --quiet; then
            echo "No new intake records to commit."
          else
            git commit -m "intake: register Ask Loom research request #${{ github.event.issue.number }}"
            git push
          fi

      - name: Confirm receipt on the request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INQUIRY_ID: ${{ steps.ingest.outputs.inquiry_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Loom has registered this request as inquiry **$INQUIRY_ID**. The question has been classified and a research plan has been created. This is **receipt and triage, not a finding or an approval to publish**. Human review and evidence validation remain required."
