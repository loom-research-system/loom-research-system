name: Deploy Project Loom v2 to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf public
          cp -R site public

          # Publish standalone app/prototype directories alongside the main site.
          mkdir -p public/roadmap public/mirror public/receipts
          cp roadmap/index.html public/roadmap/index.html
          cp mirror/index.html public/mirror/index.html
          cp receipts/index.html public/receipts/index.html

          echo "loomresearch.xyz" > public/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
