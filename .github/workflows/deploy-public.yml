name: Deploy Loom Public Site

on:
  push:
    branches: [ "main" ]
    paths:
      - 'public/**'
      - 'specifications/**'
      - 'scripts/build_public_docs.py'
      - '.github/workflows/deploy-public.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install document renderer
        run: python -m pip install markdown

      - name: Build public research documents
        run: python scripts/build_public_docs.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
