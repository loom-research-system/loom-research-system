name: Deploy Loom Public Site

on:
  push:
    branches: [ "main" ]
    paths:
      - 'public/**'
      - 'specifications/**'
      - 'schemas/**'
      - 'artifacts/flint/**'
      - 'content/flint-water-crisis.md'
      - 'scripts/build_public_docs.py'
      - 'scripts/validate_flint_artifacts.py'
      - 'loom_validator/**'
      - 'tests/**'
      - '.github/workflows/deploy-public.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install validation and document dependencies
        run: python -m pip install markdown pyyaml jsonschema

      - name: Run validator stress tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Flint artifacts and generate SHA-256 manifest
        id: flint_validation
        continue-on-error: true
        run: python scripts/validate_flint_artifacts.py

      - name: Build public research documents
        run: python scripts/build_public_docs.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mark workflow failed if artifact validation failed
        if: steps.flint_validation.outcome == 'failure'
        run: |
          echo "Flint artifact validation failed. The site was deployed with a visible failure state and diagnostic manifest."
          exit 1
