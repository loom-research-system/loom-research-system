$schema: "http://json-schema.org/draft-07/schema#"
$id: "loom://schemas/actor.schema.yaml"
title: "Actor"
description: "A human, system, agent, or model that participates in the Loom research process"
type: object
required:
  - id
  - type
  - name
  - created
properties:
  id:
    type: string
    pattern: "^ACT-[0-9]{4,}$"
    description: "Unique actor identifier"
  type:
    type: string
    enum: ["human", "system", "agent", "model"]
    description: "Actor classification"
  name:
    type: string
    description: "Human-readable name or identifier"
  affiliation:
    type: string
    description: "Optional organizational affiliation (for humans)"
  role:
    type: string
    enum: ["founder", "internal_auditor", "external_auditor", "researcher", "system"]
    description: "Actor's role in the Loom governance model"
  conflict_disclosure:
    type: string
    description: "Any conflicts of interest (required for auditors)"
  created:
    type: string
    format: date-time
    description: "When this actor record was created"
additionalProperties: false