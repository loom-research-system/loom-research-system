$schema: "http://json-schema.org/draft-07/schema#"
$id: "loom://schemas/research_plan.schema.yaml"
title: "Loom Research Plan"
type: object
required: [id, type, inquiry_id, question_type, depth, objective, research_steps, status, created, updated]
properties:
  id: {type: string, pattern: "^PLAN-[0-9]{4,}$"}
  type: {type: string, const: "research_plan"}
  inquiry_id: {type: string, pattern: "^INQ-(?:[A-Z0-9]+-)?[0-9]{4,}$"}
  question_type: {type: string}
  depth: {type: string, enum: [quick_read, loom_brief, full_loom_audit]}
  objective: {type: string, minLength: 10}
  research_steps:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, purpose, evidence_target, status]
      properties:
        id: {type: string}
        purpose: {type: string}
        evidence_target: {type: string}
        suggested_sources: {type: array, items: {type: string}}
        status: {type: string, enum: [pending, active, complete, blocked]}
      additionalProperties: false
  stopping_conditions:
    type: array
    items: {type: string}
  unresolved_questions:
    type: array
    items: {type: string}
  status: {type: string, enum: [draft, ready, researching, blocked, complete]}
  created: {type: string, format: date-time}
  updated: {type: string, format: date-time}
additionalProperties: false
