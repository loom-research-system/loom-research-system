extracted_content: "The EPA Office of Inspector General's October 20, 2016 Management Alert states that EPA Region 5 had the authority and sufficient information to issue a Safe Drinking Water Act Section 1431 emergency order to protect Flint residents from lead-contaminated water as early as June 2015. It says Region 5 had information that systems designed to protect Flint drinking water from lead contamination were not in place and that some home test results exceeded the federal action level."
